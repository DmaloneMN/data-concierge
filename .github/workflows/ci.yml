name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit Tests (Python 3.11)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=." >> $GITHUB_ENV

      - name: Create stub .env for tests
        run: |
          echo "AZURE_OPENAI_ENDPOINT=https://stub.openai.azure.com/" >> .env
          echo "AZURE_OPENAI_API_KEY=stub-key" >> .env
          echo "MODEL_DEPLOYMENT=gpt-4o" >> .env
          echo "FABRIC_SQL_ENDPOINT=" >> .env
          echo "FABRIC_DATABASE=" >> .env
          echo "ENVIRONMENT=test" >> .env

      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short

      - name: Run linting
        run: ruff check src/ tests/
